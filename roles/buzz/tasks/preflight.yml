---

 # Fail on the pin being absent rather than silently installing whatever the
 # "latest" release happens to be that day - the whole point of the variable.
 - name: assert a buzz release is pinned
   ansible.builtin.assert:
    that:
      - buzz_version | length > 0
      - buzz_deb_sha256 | length > 0
    fail_msg: >-
     buzz_version and buzz_deb_sha256 must both be set. The checksum is not
     optional: the .deb is fetched over the network and the binary inside it is
     installed root owned into {{ buzz_bin }}.

 # The adapter resolves BUZZ_CLI_PATH -> which("buzz") -> ~/bin/buzz. The last
 # of those sits in the agent's own writable state, so an absolute path outside
 # it is the only safe answer.
 - name: assert the binary path is absolute
   ansible.builtin.assert:
    that: buzz_bin is match('^/')
    fail_msg: "buzz_bin must be an absolute path, got: {{ buzz_bin }}"

 - name: assert a profile has somewhere to be published
   ansible.builtin.assert:
    that:
      - buzz_relay_url | length > 0
      - buzz_private_key_entry | length > 0
    fail_msg: >-
     buzz_profile is set, so the role publishes it - which needs buzz_relay_url
     and buzz_private_key_entry (a pass entry path, not the key itself).
   when: buzz_profile.name | default('') | length > 0

 # A malformed tag is rejected by the relay, not by the CLI, and the profile
 # task reads element 1 of it to tell whether the attestation has landed. Both
 # failures are confusing after the fact, so check the shape NIP-OA mandates
 # here: exactly four strings, the first of them "auth".
 - name: assert the owner attestation is a well formed NIP-OA auth tag
   ansible.builtin.assert:
    that:
      # first, so that something that is not JSON at all fails with the message
      # below rather than with a template error from from_json
      - buzz_auth_tag is match('^\[\s*"auth"')
      - buzz_auth_tag | from_json is not string
      - buzz_auth_tag | from_json | length == 4
      - (buzz_auth_tag | from_json)[0] == 'auth'
      - (buzz_auth_tag | from_json)[1] is match('^[0-9a-f]{64}$')
      - (buzz_auth_tag | from_json)[3] is match('^[0-9a-f]{128}$')
    fail_msg: >-
     buzz_auth_tag must be the JSON array ["auth", "<owner pubkey>",
     "<conditions>", "<sig>"] as minted by tools/buzz/attest.py, got:
     {{ buzz_auth_tag }}
   when: buzz_auth_tag | length > 0

 - name: assert an attested profile is also published
   ansible.builtin.assert:
    that: buzz_profile.name | default('') | length > 0
    fail_msg: >-
     buzz_auth_tag is set but buzz_profile is not. The attestation only reaches
     the community on the agent's kind:0 profile, which this role publishes -
     without a profile the tag is never sent anywhere.
   when: buzz_auth_tag | length > 0
