---

  # ---- operator accounts ----
  # Login accounts, one per human operator, each entry a mapping of "name" and
  # "authorized_keys" (a list of public key strings):
  #   claude_operator_users:
  #     - name: alice
  #       authorized_keys:
  #         - "ssh-ed25519 AAAA... alice@laptop"
  # Every account gets a home (0700), a workspace root and, once it has signed
  # in, its own ~/.claude holding the credential and every transcript.
  #
  # Deliberately LOGIN users, against this collection's "one service, one system
  # user with nologin shell" convention: this host is not a service, it is the
  # operator's own working environment (see README, "Deviations"). Empty by
  # default because this repository is public - the composing playbook supplies
  # the accounts and their keys.
  claude_operator_users: []

  # ---- claude code ----
  # Pinned, like every upstream release in this collection. The floor is higher
  # than it looks: Remote Control reconnect after a stale token needs 2.1.224 and
  # effort control from a connected device needs 2.1.234.
  #
  # DISABLE_AUTOUPDATER is deliberately NOT set anywhere. The sibling deployment
  # sets it because a version bump can change tool semantics under an unattended
  # service; here a human is present and Remote Control's behaviour is version
  # gated in ways that favour being current. The pin is the package, and an
  # operator updating their own session is their business.
  claude_operator_claude_version: "2.1.260"
  # Installed globally under this prefix and left root owned, so an operator
  # cannot silently drift the binary the whole host shares.
  claude_operator_npm_prefix: /usr/local
  claude_operator_bin: /usr/local/bin/claude

  # ---- node runtime ----
  # Claude Code is a node program. Installed from the NodeSource repository
  # (Ubuntu ships an older node). Set to false once the distribution offers
  # claude_operator_node_version, the role then only verifies it.
  claude_operator_install_node: true
  claude_operator_node_version: "26"
  # Absolute paths, NOT the bare names. Other software puts a node of its own on
  # the shared PATH - the Hermes installer symlinks /usr/local/bin/node at its
  # private runtime - and /usr/local/bin precedes /usr/bin, so a bare "node"
  # silently resolves to someone else's major. Override both when the caller
  # provides the runtime from somewhere else.
  claude_operator_node_bin: /usr/bin/node
  claude_operator_npm_bin: /usr/bin/npm

  # ---- host packages ----
  # tmux keeps a session alive across an SSH disconnect and, unlike a service,
  # keeps a local terminal attached to it. git is what "claude --worktree" needs.
  claude_operator_packages:
    - tmux
    - git

  # ---- workspaces ----
  # Working trees live under ~/<dirname>, one directory per project, and they are
  # long lived: Claude Code keys a session's history to its working directory, so
  # moving a tree loses "claude --continue" in the new location.
  #
  # The workspace root is deliberately NOT the home directory. The startup trust
  # dialog never saves trust for a home directory, so a session started there can
  # never satisfy the workspace-trust precondition Remote Control requires - and
  # a session in $HOME has ~/.claude, the credential included, in scope.
  claude_operator_workspace_dirname: work
  # Project directories created empty under every account's workspace root. The
  # operator clones into them; the role does not manage repository contents.
  claude_operator_projects: []

  # ---- session wrapper ----
  # Operator convenience over "claude --worktree --tmux=classic" and
  # "claude --remote-control". Set to "" to skip installing it.
  claude_operator_session_bin: /usr/local/bin/claude-session
  # Login banner. An update-motd.d snippet that shows claude-session's own --help,
  # colourised, so somebody arriving over SSH sees what the host is for without
  # having to know the command exists. It runs the wrapper rather than repeating
  # it, so the two cannot drift apart. Set to "" to install no banner.
  claude_operator_motd_path: /etc/update-motd.d/99-claude-session

  # Permission mode the wrapper starts sessions with. Ergonomics here, not
  # containment: a human is present and can also answer from a connected device,
  # since permission prompts are forwarded and stay open until answered.
  # "dontAsk" is the correct value in the sibling deployment and the WRONG one
  # here - it denies silently instead of asking someone who is right there.
  # preflight.yml refuses it.
  claude_operator_permission_mode: acceptEdits
