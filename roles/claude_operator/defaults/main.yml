---

  # ---- operator accounts ----
  # Login accounts, one per human operator, each entry a mapping of "name" and
  # "authorized_keys" (a list of public key strings):
  #   claude_operator_users:
  #     - name: alice
  #       authorized_keys:
  #         - "ssh-ed25519 AAAA... alice@laptop"
  # Every account gets a home (0700), a workspace root and, once it has signed
  # in, its own ~/.claude holding the credential and every transcript.
  #
  # Deliberately LOGIN users, against this collection's "one service, one system
  # user with nologin shell" convention: this host is not a service, it is the
  # operator's own working environment (see README, "Deviations"). Empty by
  # default because this repository is public - the composing playbook supplies
  # the accounts and their keys.
  claude_operator_users: []
  # An entry may also carry "pass_repository", the git URL of that operator's
  # password store (see "password store" below):
  #   claude_operator_users:
  #     - name: alice
  #       authorized_keys: [...]
  #       pass_repository: ssh://alice@git.example.org/srv/git/credentials.git

  # ---- claude code ----
  # Pinned, like every upstream release in this collection. The floor is higher
  # than it looks: Remote Control reconnect after a stale token needs 2.1.224 and
  # effort control from a connected device needs 2.1.234, and reading a repository's
  # AGENTS.md as project instructions needs 2.1.277 (2.1.281 where telemetry is off).
  #
  # DISABLE_AUTOUPDATER is deliberately NOT set anywhere. The sibling deployment
  # sets it because a version bump can change tool semantics under an unattended
  # service; here a human is present and Remote Control's behaviour is version
  # gated in ways that favour being current. The pin is the package, and an
  # operator updating their own session is their business.
  claude_operator_claude_version: "2.1.302"
  # Installed globally under this prefix and left root owned, so an operator
  # cannot silently drift the binary the whole host shares.
  claude_operator_npm_prefix: /usr/local
  claude_operator_bin: /usr/local/bin/claude

  # ---- node runtime ----
  # Claude Code is a node program. Installed from the NodeSource repository
  # (Ubuntu ships an older node). Set to false once the distribution offers
  # claude_operator_node_version, the role then only verifies it.
  claude_operator_install_node: true
  claude_operator_node_version: "26"
  # Absolute paths, NOT the bare names. Other software puts a node of its own on
  # the shared PATH - the Hermes installer symlinks /usr/local/bin/node at its
  # private runtime - and /usr/local/bin precedes /usr/bin, so a bare "node"
  # silently resolves to someone else's major. Override both when the caller
  # provides the runtime from somewhere else.
  claude_operator_node_bin: /usr/bin/node
  claude_operator_npm_bin: /usr/bin/npm

  # ---- host packages ----
  # tmux keeps a session alive across an SSH disconnect and, unlike a service,
  # keeps a local terminal attached to it. git is what "claude --worktree" needs.
  # xclip and xauth carry the clipboard over SSH X11 forwarding, see below.
  # kitty-terminfo: kitty sets TERM=xterm-kitty, which ncurses does not ship, and
  # tmux refuses to attach a client whose terminal it cannot describe.
  claude_operator_packages:
    - tmux
    - git
    - xclip
    - xauth
    - kitty-terminfo
  # sshpass lets ansible log in with a password ("ansible -k"), which a brand new
  # host without keys needs. Off by default: only a host that runs playbooks
  # wants it, and it hands passwords around on the command line.
  claude_operator_install_sshpass: false

  # ---- clipboard ----
  # Claude Code copies a selection (Ctrl+C) and pastes (Ctrl+V) through the
  # clipboard of the host it runs on: xclip, when DISPLAY is set. With "ssh -X"
  # that display is the operator's own desktop, so both keys reach the local
  # clipboard - the only route for a terminal without OSC 52, GNOME Terminal
  # among them. A session outlives the connection it was started from, so an
  # xclip shim in /usr/local/bin always uses the display of the operator's
  # LATEST login, which a profile.d snippet and claude-session record.
  claude_operator_x11_clipboard: true
  claude_operator_xclip_shim_path: /usr/local/bin/xclip
  claude_operator_xclip_bin: /usr/bin/xclip
  claude_operator_x11_profile_path: /etc/profile.d/claude-session-display.sh
  # The OSC 52 route, for terminals that implement it (kitty, WezTerm, foot,
  # Alacritty, iTerm2): /etc/tmux.conf with "set-clipboard on", so a copy made
  # inside tmux - by tmux itself or by a program in the pane - reaches the
  # local clipboard. Does no harm under a terminal that ignores OSC 52.
  claude_operator_tmux_osc52: true
  claude_operator_tmux_conf_path: /etc/tmux.conf

  # ---- ssh ----
  # Every account gets an ed25519 key pair of its own (~/.ssh/id_ed25519), so
  # git over ssh works from the host. Generated on the host and never copied off
  # it: the role only ever reports the public half, which belongs in the git
  # server's authorized keys. An existing key is left alone.
  claude_operator_ssh_key_type: ed25519

  # ---- MCP servers ----
  # MCP servers registered in the operators' user scope (~/.claude.json), so
  # every session of the account has them whatever its working directory. Each
  # entry: "name", "config" - the server in Claude Code's own format, exactly
  # what "claude mcp add-json" takes - and optionally "users", the accounts it
  # goes to (default: every operator account), and "state" (present, the
  # default, or absent to take a server away). Servers not listed here, such as
  # one an operator added by hand, are left alone.
  #   claude_operator_mcp_servers:
  #     - name: tracker
  #       users: [alice]
  #       config:
  #         type: http
  #         url: http://mcp.example.org:3333/mcp
  #         headers:
  #           Authorization: "Bearer {{ lookup('community.general.passwordstore', 'example/mcp-token') }}"
  #     - name: local-tool
  #       config:
  #         command: /usr/local/bin/some-mcp-server
  #         args: ["--stdio"]
  #         env:
  #           API_KEY: "{{ lookup('community.general.passwordstore', 'example/api-key') }}"
  # Secrets belong in a passwordstore lookup, as above: the values end up in
  # ~/.claude.json (0600), and the role handles them with no_log.
  claude_operator_mcp_servers: []

  # ---- password store ----
  # Optional, per account: an operator entry with "pass_repository" gets pass and
  # gnupg, and the store cloned to ~/<dirname> over ssh. The private gpg key is
  # NOT provisioned - it is the one secret the store hinges on and is imported by
  # hand (see README, "Password store"). The role reports what is still missing.
  claude_operator_pass_packages:
    - pass
    - gnupg
    # gpg-agent asks for the passphrase on the terminal: there is no desktop.
    - pinentry-curses
  # pass' own default. Anything else is exported as PASSWORD_STORE_DIR by the
  # profile.d snippet below.
  claude_operator_pass_dirname: .password-store
  claude_operator_pass_profile_path: /etc/profile.d/claude-operator-pass.sh
  # Seconds gpg-agent keeps the store key's passphrase after it was unlocked,
  # written as default-cache-ttl and max-cache-ttl to each account's
  # ~/.gnupg/gpg-agent.conf. Undefined by default: gpg-agent.conf is left alone.
  # claude_operator_pass_timeout: 28800

  # ---- workspaces ----
  # Working trees live under ~/<dirname>, one directory per project, and they are
  # long lived: Claude Code keys a session's history to its working directory, so
  # moving a tree loses "claude --continue" in the new location.
  #
  # The workspace root is deliberately NOT the home directory. The startup trust
  # dialog never saves trust for a home directory, so a session started there can
  # never satisfy the workspace-trust precondition Remote Control requires - and
  # a session in $HOME has ~/.claude, the credential included, in scope.
  claude_operator_workspace_dirname: work
  # Project directories created empty under every account's workspace root. The
  # operator clones into them; the role does not manage repository contents.
  claude_operator_projects: []

  # ---- session wrapper ----
  # Operator convenience over tmux, git worktrees and "claude --remote-control". Set to "" to skip installing it.
  claude_operator_session_bin: /usr/local/bin/claude-session
  # Login banner. An update-motd.d snippet that shows claude-session's own --help,
  # colourised, so somebody arriving over SSH sees what the host is for without
  # having to know the command exists. It runs the wrapper rather than repeating
  # it, so the two cannot drift apart. Set to "" to install no banner.
  claude_operator_motd_path: /etc/update-motd.d/99-claude-session

  # Permission mode the wrapper starts sessions with. Ergonomics here, not
  # containment: a human is present and can also answer from a connected device,
  # since permission prompts are forwarded and stay open until answered.
  # "dontAsk" is the correct value in the sibling deployment and the WRONG one
  # here - it denies silently instead of asking someone who is right there.
  # preflight.yml refuses it.
  claude_operator_permission_mode: acceptEdits
