---

 # Claude Code is a node program. Ubuntu 24.04 ships node 18, older than upstream
 # expects, so the runtime comes from the NodeSource repository. Set
 # claude_operator_install_node to false and provide node yourself once the
 # distribution ships claude_operator_node_version.

 - name: install the prerequisites of the nodesource repository
   become: yes
   ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

 - name: ensure the apt keyring directory exists
   become: yes
   ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

 - name: add the nodesource signing key
   become: yes
   ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    owner: root
    group: root
    mode: "0644"

 - name: add the nodesource repository
   become: yes
   ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ claude_operator_node_version }}.x nodistro main"
    filename: nodesource
    state: present
    update_cache: yes

 - name: install nodejs
   become: yes
   ansible.builtin.apt:
    name: nodejs
    state: present
