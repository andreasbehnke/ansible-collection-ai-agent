---

  # ---- service identity ----
  hermes_user: hermes
  hermes_group: hermes
  # Unit name generated by "hermes gateway install --system".
  hermes_service_name: hermes-gateway

  # ---- installation ----
  # OS packages the installer expects to find. It pulls python, node, ripgrep
  # and ffmpeg itself, but not these.
  hermes_packages:
    - git
    - curl
    - xz-utils
    - build-essential
  # Upstream release tag to pin the checkout to, e.g. "v2026.8.31". Set to "" to
  # take whatever the installer's default branch serves, which is what this role
  # did before and is how an unreviewed main-branch commit once reached this host.
  #
  # The installer has no --tag: --commit rejects anything that is not a hex SHA,
  # and --branch corrupts remote.origin.fetch when handed a tag on an existing
  # install. tasks/install.yml therefore resolves the tag to its commit itself.
  #
  # DO NOT run "hermes update" on a pinned install. From a detached HEAD it
  # reattaches to main and silently discards the pin; "hermes update --branch
  # <tag>" is rejected outright. Move the pin here and re-run the role instead.
  hermes_version: "v2026.8.31"
  hermes_installer_url: https://hermes-agent.nousresearch.com/install.sh
  # Cloned by the installer; also where the tag is resolved against.
  hermes_repo_url: https://github.com/NousResearch/hermes-agent.git
  # Locations the installer uses when it runs as root.
  hermes_bin: /usr/local/bin/hermes
  hermes_code_dir: /usr/local/lib/hermes-agent
  # Operator wrapper that runs the CLI as the service user against its managed
  # state, so a sudo-capable login does not need to know user, HERMES_HOME and
  # the fact that both directories are unreadable to it. Set to "" to skip it.
  hermes_ctl_bin: /usr/local/bin/hermesctl

  # ---- extra python packages ----
  # Optional pip requirements installed into Hermes' own venv, for backends that
  # need a client library the base install omits - Hermes ships several as
  # optional extras (e.g. the firecrawl web_extract backend needs firecrawl-py).
  # Each entry is a pip requirement string (e.g. "firecrawl-py==4.17.0"); the
  # composing playbook supplies them for the backends it enables. Installed with
  # the same uv the installer used, into the root-owned venv (immutable to the
  # agent), and Hermes is restarted so it picks them up. Empty means none.
  hermes_pip_extras: []
  # uv binary (the installer drops it in HERMES_HOME/bin) and the venv python it
  # targets. Override only if the installer's layout changes.
  hermes_uv_bin: "{{ hermes_home }}/bin/uv"
  hermes_venv_python: "{{ hermes_code_dir }}/venv/bin/python"

  # ---- directories ----
  # Managed scope: administrator owned policy, not writable by the agent.
  hermes_config_dir: /etc/hermes
  # HERMES_HOME, the writable state directory: config.yaml, .env, memories,
  # skills, sessions and logs the agent creates while it runs.
  hermes_home: /var/lib/hermes

  # ---- managed configuration ----
  # Pinned keys of the managed config.yaml, empty means nothing is pinned.
  hermes_managed_config: {}
  # Plain values of the managed .env, e.g. {SIGNAL_HTTP_URL: "http://127.0.0.1:8080"}.
  hermes_managed_env: {}
  # Secret values of the managed .env: environment variable -> password store
  # entry, e.g. {ANTHROPIC_API_KEY: "private/ai/anthropic"}.
  hermes_managed_env_secrets: {}

  # ---- service hardening ----
  hermes_service_hardening: true
  # Additional writable paths for the agent, it can only write to its state
  # directory otherwise.
  hermes_service_read_write_paths: []

  # ---- outbound media handoff ----
  # Hermes sends attachments by handing the chat daemon the PATH of a file it
  # wrote; the daemon opens that path as its own service user, so the file has to
  # be readable by it. Set this to that service user's group to make the media
  # dirs below group readable: they become setgid to this group and the service
  # umask is relaxed to 0027, so new files are 0640 hermes:<group>. Empty keeps
  # the strict default (off); everything outside these dirs stays group hermes.
  #
  # Only dirs Hermes does NOT manage can be shared. Hermes re-asserts 0700 on its
  # own home and cache trees (image_cache, audio_cache, ...) at startup and on
  # reconnect - upstream bug #10757, no opt-out - so those cannot be opened up and
  # its auto-cached images cannot be delivered to a separate daemon. Use an
  # operator-owned "outbox" the agent writes into and references (MEDIA:), and
  # allow it in the managed HERMES_MEDIA_ALLOW_DIRS.
  #
  # HERMES_HOME itself stays 0700, so the reader cannot traverse into the outbox
  # by path - it gets a scoped read-only view in its own mount namespace instead.
  # For the signal_cli role that is signal_cli_foreign_read_mounts, wired in the
  # composing playbook.
  hermes_media_reader_group: ""
  # Media directories under HERMES_HOME shared with hermes_media_reader_group.
  # Keep to operator-owned dirs (default: outbox) - Hermes' own cache trees are
  # force-locked to 0700 and cannot be shared (see above).
  hermes_media_dirs:
    - outbox
  # Systemd services to restart once the media dirs exist, so a reader service
  # that mounts them read only picks them up. Empty means none; the composing
  # playbook names the chat daemon here (it usually starts before this role runs,
  # when the dirs do not exist yet).
  hermes_media_notify_restart: []

  # ---- agent context files ----
  # Files written into HERMES_HOME that Hermes injects into the agent's system
  # prompt: AGENTS.md carries standing operational instructions, SOUL.md the
  # agent's identity (both are read only from HERMES_HOME). Map of filename to
  # content. The agent can edit them, the role re-asserts them every run. Empty
  # means none. Use AGENTS.md for instructions - it is additive and does not
  # replace the persona. Example (steer attachments to the shared outbox):
  #   hermes_context_files:
  #     AGENTS.md: |
  #       When you send a file as an attachment, write it under
  #       /var/lib/hermes/outbox/ and reference it there.
  hermes_context_files: {}
