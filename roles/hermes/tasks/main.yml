---

 - include_tasks: preflight.yml
 - include_tasks: install.yml
 # After install (it changes the venv), before config/service so the restart-hermes
 # handler that this may queue fires once, at the end, with the deps in place.
 - include_tasks: extras.yml
   when: hermes_pip_extras | length > 0
 - include_tasks: config.yml
 - include_tasks: service.yml
 - include_tasks: context.yml
   when: hermes_context_files | length > 0
 # Runs last: it owns the group of the shared media directories outright, and
 # service.yml prunes them out of its ownership repair so the two do not fight.
 - include_tasks: media.yml
   when: hermes_media_reader_group | length > 0
