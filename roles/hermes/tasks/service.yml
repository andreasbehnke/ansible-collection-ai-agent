---

 # Upstream generates the unit, so its service definition stays compatible with
 # the gateway (watchdog, exec line). --run-as-user makes it bake in the service
 # user, otherwise the installer records whoever ran it (root/SUDO_USER) and the
 # gateway's own tooling (gateway status regenerates and compares the unit) then
 # reaches into that user's home and fails. Hardening on top comes from the
 # drop-in below.
 - name: read the installed gateway unit
   become: yes
   ansible.builtin.slurp:
    src: "/etc/systemd/system/{{ hermes_service_name }}.service"
   register: hermes_unit_file
   failed_when: false

 - name: install the hermes gateway system service
   become: yes
   ansible.builtin.command: >-
    {{ hermes_bin }} gateway install --system
    --run-as-user {{ hermes_user }} --force
   environment:
    HERMES_HOME: "{{ hermes_home }}"
   # Also when the code tree moved: a new release can change ExecStart, the
   # watchdog interval or Type=, and upstream's own "gateway status" regenerates
   # and compares the unit - so a stale one left behind after a version change
   # surfaces later as drift rather than here.
   when: >-
    hermes_unit_file.content is not defined or
    ('User=' ~ hermes_user) not in (hermes_unit_file.content | b64decode) or
    hermes_code_changed | default(false)
   notify: restart hermes

 # The installer and the service installer run as root and leave root owned
 # files behind in the state directory (logs above all), which the service
 # cannot write to afterwards. Enforced here, after the last root side task.
 #
 # Asserted, then repaired only where it is actually wrong, instead of a blanket
 # "recurse: yes". The blanket chown also re-grouped the shared media directories
 # to hermes on every run; media.yml set them back, so both tasks reported changed
 # forever and the notify on them restarted the reader services every single run.
 # vars/main.yml prunes those directories out of the search for that reason.
 - name: own the state directory
   become: yes
   ansible.builtin.file:
    path: "{{ hermes_home }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_group }}"

 # -print -quit: this only has to answer "is anything wrong", and stopping at the
 # first hit keeps it cheap on a state tree with tens of thousands of files.
 - name: look for state entries the service user does not own
   become: yes
   ansible.builtin.command:
    cmd: "{{ hermes_ownership_find }} -print -quit"
   register: hermes_misowned
   changed_when: false
   check_mode: no

 # -h so a symlink is retargeted rather than its target, which may live outside
 # the state tree. One exec for the whole batch, and only when the check above
 # found something.
 - name: repair the ownership of the state tree
   become: yes
   ansible.builtin.command:
    cmd: >-
     {{ hermes_ownership_find }}
     -exec chown -h {{ hermes_user }}:{{ hermes_group }} {} +
   when: hermes_misowned.stdout | length > 0

 - name: create the systemd drop-in directory
   become: yes
   ansible.builtin.file:
    path: "/etc/systemd/system/{{ hermes_service_name }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

 - name: install the systemd drop-in
   become: yes
   ansible.builtin.template:
    src: service-override.conf.j2
    dest: "/etc/systemd/system/{{ hermes_service_name }}.service.d/10-ansible.conf"
    owner: root
    group: root
    mode: "0644"
   notify: restart hermes

 - name: enable the hermes gateway at boot time
   become: yes
   ansible.builtin.systemd_service:
    name: "{{ hermes_service_name }}"
    daemon_reload: yes
    enabled: yes

 - name: check whether hermes is configured
   become: yes
   ansible.builtin.stat:
    path: "{{ hermes_home }}/config.yaml"
   register: hermes_state_config

 # An unconfigured agent has no model and no messaging platform, the gateway
 # would only crash loop. It is started once a configuration exists.
 - name: start the hermes gateway
   become: yes
   ansible.builtin.systemd_service:
    name: "{{ hermes_service_name }}"
    state: started
   when: hermes_state_config.stat.exists

 - name: report the missing configuration
   ansible.builtin.debug:
    msg: >-
      No configuration in {{ hermes_home }}/config.yaml. {{ hermes_service_name }} is
      enabled but not started. Configure the agent with
      "sudo -u {{ hermes_user }} HERMES_HOME={{ hermes_home }} {{ hermes_bin }} setup",
      then run this role again.
   when: not hermes_state_config.stat.exists
