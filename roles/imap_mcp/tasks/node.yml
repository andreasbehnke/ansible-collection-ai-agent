---

 # imap-mcp-server and supergateway are node programs. Ubuntu 24.04 ships node
 # 18, older than upstream expects, so the runtime comes from the NodeSource
 # repository. Set imap_mcp_install_node to false and provide node yourself once
 # the distribution ships imap_mcp_node_version.

 - name: install the prerequisites of the nodesource repository
   become: yes
   ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

 - name: ensure the apt keyring directory exists
   become: yes
   ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

 - name: add the nodesource signing key
   become: yes
   ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    owner: root
    group: root
    mode: "0644"

 # The repository file is written whole rather than through apt_repository,
 # which only ensures a line is PRESENT: bumping the pinned major left the previous
 # major's line in place, so a host ended up with two NodeSource repositories
 # enabled at once and the candidate decided by whichever numbered higher.
 - name: pin the nodesource repository to node {{ imap_mcp_node_version }}
   become: yes
   ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nodesource.list
    content: |
      deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ imap_mcp_node_version }}.x nodistro main
    owner: root
    group: root
    mode: "0644"
   register: imap_mcp_nodesource_repo

 - name: refresh the package index after a repository change
   become: yes
   ansible.builtin.apt:
    update_cache: yes
   when: imap_mcp_nodesource_repo.changed

 # state: latest, not present. "present" is satisfied by ANY installed nodejs,
 # so on a host that already had a node it silently kept the old major and the
 # preflight assert below failed with "node N found, this role expects M".
 # The major is pinned by the repository above; latest only moves within it.
 - name: install nodejs from the pinned major
   become: yes
   ansible.builtin.apt:
    name: nodejs
    state: latest
