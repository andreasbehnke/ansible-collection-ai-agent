---

 - name: install the imap-mcp systemd unit
   become: yes
   ansible.builtin.template:
    src: imap-mcp.service.j2
    dest: "/etc/systemd/system/{{ imap_mcp_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
   notify: restart imap-mcp

 - name: enable the imap-mcp service at boot time
   become: yes
   ansible.builtin.systemd_service:
    name: "{{ imap_mcp_service_name }}"
    daemon_reload: yes
    enabled: yes

 - name: check whether the account store exists
   become: yes
   ansible.builtin.stat:
    path: "{{ imap_mcp_home }}/.imap-mcp/accounts.json"
   register: imap_mcp_account_state

 # Without an account the server has nothing to serve, so it is only started once
 # the account store has been restored or set up.
 - name: start the imap-mcp service
   become: yes
   ansible.builtin.systemd_service:
    name: "{{ imap_mcp_service_name }}"
    state: started
   when: imap_mcp_account_state.stat.exists

 - name: report the missing account
   ansible.builtin.debug:
    msg: >-
      No account store in {{ imap_mcp_home }}/.imap-mcp. {{ imap_mcp_service_name }}
      is enabled but not started. Set up the mailbox account once and store it in
      the password store (see README), then run this role again.
   when: not imap_mcp_account_state.stat.exists
