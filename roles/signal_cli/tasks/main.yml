---

 # Runs before preflight, which then verifies the runtime it installed.
 - include_tasks: java.yml
   when: signal_cli_install_java
 - include_tasks: preflight.yml
 - include_tasks: install.yml
 - include_tasks: config.yml
 - include_tasks: accounts.yml
 - include_tasks: service.yml
 - include_tasks: profile.yml
   when: signal_cli_profile | length > 0
 # Last: it must see the service as service.yml left it, to know which release
 # is in use and therefore must survive.
 - include_tasks: cleanup.yml
   when: signal_cli_remove_old_releases
